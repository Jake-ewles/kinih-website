<!doctype html>
<html lang="en" dir="ltr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results | Kinih Fitness & Coaching</title>
<meta name="description" content="Real member results at Kinih: tracked progress, weekly coaching and member stories from Aïn Sebaâ, Casablanca.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">

<link rel="stylesheet" href="assets/css/style.css">

<body data-page="results">

<section class="page-hero">
  <div class="ph-bg" style="background-image:url('images/result-3.png')"></div>
  <div class="container">
    <div class="label" data-i18n="pg.res.label"></div>
    <h1 class="display" data-i18n="pg.res.title"></h1>
    <p data-i18n="pg.res.sub"></p>
    <div class="crumbs"><a href="index.html" data-i18n="crumb.home"></a> / <span data-i18n="nav.results"></span></div>
  </div>
</section>

<section class="stats">
  <div class="container stats-grid">
    <div class="stat"><i class="fa-solid fa-users"></i><div class="stat-num"><span data-count="240">0</span>+</div><div class="stat-label" data-i18n="stats.1"></div></div>
    <div class="stat"><i class="fa-solid fa-user-tie"></i><div class="stat-num"><span data-count="3">0</span></div><div class="stat-label" data-i18n="stats.2"></div></div>
    <div class="stat"><i class="fa-solid fa-medal"></i><div class="stat-num"><span data-count="18">0</span>+</div><div class="stat-label" data-i18n="stats.3"></div></div>
    <div class="stat"><i class="fa-regular fa-calendar-check"></i><div class="stat-num"><span data-count="7">0</span>/7</div><div class="stat-label" data-i18n="stats.4"></div></div>
    <div class="stat"><i class="fa-solid fa-hand-holding-dollar"></i><div class="stat-num"><span data-count="0">0</span></div><div class="stat-label" data-i18n="stats.5"></div></div>
  </div>
</section>

<section class="results-page dots">
  <div class="container">
    <div class="center">
      <div class="label" data-i18n="res.label"></div>
      <h2 class="display h-sec" data-i18n="res.title"></h2>
    </div>
    <div class="results-row">
      <div class="result" data-aos="fade-up"><img src="images/result-1.png" alt="Kinih member training"><span data-i18n="r1"></span></div>
      <div class="result" data-aos="fade-up" data-aos-delay="100"><img src="images/result-2.png" alt="Kinih member training"><span data-i18n="r2"></span></div>
      <div class="result" data-aos="fade-up" data-aos-delay="200"><img src="images/result-3.png" alt="Kinih members training"><span data-i18n="r3"></span></div>
    </div>
    <div class="t-grid">
      <div class="t-card" data-aos="fade-up"><div class="t-stars">★★★★★</div><p class="t-quote" data-i18n="q1"></p><div class="t-sep"></div><div class="t-name">Salma B.</div><div class="t-meta" data-i18n="q1m"></div></div>
      <div class="t-card" data-aos="fade-up" data-aos-delay="100"><div class="t-stars">★★★★★</div><p class="t-quote" data-i18n="q2"></p><div class="t-sep"></div><div class="t-name">Youssef E.</div><div class="t-meta" data-i18n="q2m"></div></div>
      <div class="t-card" data-aos="fade-up" data-aos-delay="200"><div class="t-stars">★★★★★</div><p class="t-quote" data-i18n="q3"></p><div class="t-sep"></div><div class="t-name">Nadia R.</div><div class="t-meta" data-i18n="q3m"></div></div>
      <div class="t-card" data-aos="fade-up"><div class="t-stars">★★★★★</div><p class="t-quote" data-i18n="q4"></p><div class="t-sep"></div><div class="t-name">Amine K.</div><div class="t-meta" data-i18n="q4m"></div></div>
      <div class="t-card" data-aos="fade-up" data-aos-delay="100"><div class="t-stars">★★★★★</div><p class="t-quote" data-i18n="q5"></p><div class="t-sep"></div><div class="t-name">Hicham T.</div><div class="t-meta" data-i18n="q5m"></div></div>
      <div class="t-card" data-aos="fade-up" data-aos-delay="200" style="background:rgba(var(--accent-rgb),.12);border-color:rgba(var(--accent-rgb),.4);justify-content:center">
        <h3 class="display" style="font-size:26px;margin-bottom:10px" data-i18n="cta.title"></h3>
        <p style="color:rgba(255,255,255,.75);margin-bottom:20px" data-i18n="cta.sub"></p>
        <a href="contact.html" class="btn btn-fill" style="align-self:flex-start"><span data-i18n="btn.book"></span></a>
      </div>
    </div>
  </div>
</section>

<section class="cta">
  <div class="ghost">KINIH</div>
  <div class="container">
    <div class="label" data-i18n="cta.label"></div>
    <h2 class="display" data-i18n="cta.title"></h2>
    <p class="sub" data-i18n="cta.sub"></p>
    <a href="tel:+212645678594" class="cta-phone">+212 6 45 67 85 94</a>
    <a href="contact.html" class="btn btn-fill"><span data-i18n="cta.btn"></span> <i class="fa-solid fa-arrow-right"></i></a>
    <small data-i18n="cta.small"></small>
  </div>
</section>

</body>
</html>
